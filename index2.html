<style>
  :root {
    --paper: #FAF7F0;
    --paper-edge: #C9A227;
    --ink: #201C16;
    --ink-soft: #5B564C;
    --line: #D8D2C3;
    --die: #201C16;
    --accent: #B4432E;
    --done: #8C9E7C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #E9E4D6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .pad {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 4px 18px 18px 4px;
    position: relative;
    padding: 28px 22px 32px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .pad::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 6px;
    bottom: 6px;
    width: 10px;
    background: var(--paper-edge);
    border-radius: 6px 0 0 6px;
  }
  .rings {
    display: flex;
    justify-content: space-between;
    padding: 0 8px;
    margin-bottom: 4px;
  }
  .ring {
    width: 14px;
    height: 22px;
    border: 3px solid var(--ink);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    opacity: 0.85;
  }
  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 18px 0 4px;
    line-height: 1.25;
  }
  h1 span { color: var(--accent); }
  .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .add-row input {
    flex: 1;
    border: none;
    border-bottom: 1.5px dashed var(--line);
    background: transparent;
    font-size: 15px;
    padding: 8px 2px;
    color: var(--ink);
    font-family: inherit;
  }
  .add-row input:focus { outline: none; border-bottom-color: var(--ink); }
  .add-row button {
    border: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    width: 38px;
    height: 38px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-row button:active { transform: scale(0.94); }

  .list-frame {
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 6px 16px;
    margin-bottom: 22px;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px dashed var(--line);
  }
  .task-row:last-child { border-bottom: none; }
  .task-num {
    font-weight: 700;
    font-size: 17px;
    width: 18px;
    flex-shrink: 0;
  }
  .task-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  .task-row.done .task-text {
    text-decoration: line-through;
    color: var(--ink-soft);
  }
  .task-row.picked { background: rgba(180,67,46,0.06); border-radius: 8px; }
  .check {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    padding: 0;
  }
  .check.on { background: var(--done); border-color: var(--done); color: white; font-size: 13px; }
  .remove {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 17px;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .empty {
    padding: 20px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .roll-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--paper);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .roll-btn:active { transform: scale(0.98); }
  .roll-btn:disabled { opacity: 0.45; cursor: default; }

  .result {
    display: none;
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 22px;
    text-align: center;
    background: #fff;
  }
  .result.show { display: block; }
  .dice-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 14px;
  }
  .die {
    width: 52px;
    height: 52px;
    border: 2.5px solid var(--die);
    border-radius: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 7px;
  }
  .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--die); margin: auto; }
  .result-task {
    font-size: 17px;
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .result-dur {
    font-size: 14px;
    color: var(--accent);
    font-weight: 700;
  }

  .timer-wrap {
    display: none;
    text-align: center;
    margin-top: 14px;
  }
  .timer-wrap.show { display: block; }
  .timer {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 12px;
  }
  .timer-controls { display: flex; gap: 10px; justify-content: center; }
  .timer-controls button {
    border: 1.5px solid var(--ink);
    background: none;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .timer-controls button.primary { background: var(--ink); color: var(--paper); }

  .duration-legend {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
  .duration-legend div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
  .duration-legend b { display: block; color: var(--ink); font-size: 14px; }

  .sync-section {
    margin-top: 24px;
    border-top: 1px dashed var(--line);
    padding-top: 18px;
  }
  .sync-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .sync-status {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .sync-status.on { color: var(--done); font-weight: 600; }
  .sync-code-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .sync-code-box code {
    flex: 1;
    font-size: 14px;
    letter-spacing: 0.02em;
    word-break: break-all;
  }
  .sync-code-box button {
    border: none;
    background: var(--ink);
    color: var(--paper);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sync-row {
    display: flex;
    gap: 8px;
  }
  .sync-row input {
    flex: 1;
    border: none;
    border-bottom: 1.5px dashed var(--line);
    background: transparent;
    font-size: 14px;
    padding: 8px 2px;
    color: var(--ink);
    font-family: inherit;
  }
  .sync-row input:focus { outline: none; border-bottom-color: var(--ink); }
  .sync-btn {
    border: 1.5px solid var(--ink);
    background: none;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .sync-btn.primary { background: var(--ink); color: var(--paper); }
  .sync-btn:disabled { opacity: 0.5; }
  .sync-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<div class="pad">
  <div class="rings">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
  </div>

  <h1>Click <span>Roll the dice </span> to pick a task</h1>
  <p class="sub">Add up to 6 tasks, then roll to find out what you're doing next and for how long.</p>

  <div class="add-row">
    <input id="taskInput" type="text" placeholder="Reply to emails" maxlength="60" />
    <button id="addBtn" aria-label="Add task">+</button>
  </div>

  <div class="list-frame" id="listFrame"></div>

  <button class="roll-btn" id="rollBtn">Roll the dice</button>

  <div class="result" id="result">
    <div class="dice-row">
      <div class="die" id="dieTask"></div>
      <div class="die" id="dieDur"></div>
    </div>
    <div class="result-task" id="resultTask"></div>
    <div class="result-dur" id="resultDur"></div>

    <div class="timer-wrap" id="timerWrap">
      <div class="timer" id="timerDisplay">00:00</div>
      <div class="timer-controls">
        <button id="startPause" class="primary">Start</button>
        <button id="resetTimer">Reset</button>
      </div>
    </div>
  </div>

  <div class="duration-legend">
    <div><b>1</b>10 min</div><div><b>2</b>20 min</div><div><b>3</b>30 min</div>
    <div><b>4</b>40 min</div><div><b>5</b>50 min</div><div><b>6</b>break</div>
  </div>

  <div class="sync-section">
    <p class="sync-title">Sync across devices</p>
    <p class="sync-status" id="syncStatus">Not synced &mdash; tasks only live on this device</p>

    <div class="sync-code-box" id="syncCodeBox" style="display:none">
      <code id="syncCodeText"></code>
      <button id="copyCode">Copy</button>
    </div>

    <div class="sync-actions" id="syncActions">
      <button class="sync-btn primary" id="startSyncBtn">Start syncing this device</button>
    </div>

    <div class="sync-row" id="connectRow" style="margin-top:10px">
      <input id="connectCodeInput" type="text" placeholder="Paste a code from another device" />
      <button class="sync-btn" id="connectBtn">Connect</button>
    </div>
  </div>
</div>

<script>
let tasks = [];

function loadTasks() {
  try {
    const saved = localStorage.getItem('rollATaskTasks');
    if (saved) tasks = JSON.parse(saved);
  } catch (e) {}
}

function saveTasks() {
  try {
    localStorage.setItem('rollATaskTasks', JSON.stringify(tasks));
  } catch (e) {}
}

function render() {
  const frame = document.getElementById('listFrame');
  frame.innerHTML = '';
  if (tasks.length === 0) {
    frame.innerHTML = '<div class="empty">Add a task below to fill your first slot.</div>';
  }
  tasks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'task-row' + (t.done ? ' done' : '');
    row.innerHTML = `
      <div class="task-num">${i + 1}</div>
      <button class="check ${t.done ? 'on' : ''}" data-i="${i}">${t.done ? '&#10003;' : ''}</button>
      <div class="task-text">${escapeHtml(t.text)}</div>
      <button class="remove" data-i="${i}" aria-label="Remove task">&#215;</button>
    `;
    frame.appendChild(row);
  });
  document.getElementById('rollBtn').disabled = tasks.filter(t => !t.done).length === 0;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('listFrame').addEventListener('click', (e) => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  if (e.target.classList.contains('check')) {
    tasks[i].done = !tasks[i].done;
    saveTasks();
    pushToCloud();
    render();
  } else if (e.target.classList.contains('remove')) {
    tasks.splice(i, 1);
    saveTasks();
    pushToCloud();
    render();
  }
});

function addTask() {
  const input = document.getElementById('taskInput');
  const val = input.value.trim();
  if (!val) return;
  if (tasks.length >= 6) {
    input.placeholder = 'Full up, finish or clear a slot first';
    return;
  }
  tasks.push({ text: val, done: false });
  input.value = '';
  saveTasks();
  pushToCloud();
  render();
}

document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});

const durations = { 1: 10, 2: 20, 3: 30, 4: 40, 5: 50, 6: 0 };

function pipsForFace(face) {
  const map = {
    1: [5],
    2: [1, 9],
    3: [1, 5, 9],
    4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9],
    6: [1, 3, 4, 6, 7, 9]
  };
  return map[face];
}

function renderDie(el, face) {
  el.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const cell = document.createElement('div');
    if (pipsForFace(face).includes(i)) cell.className = 'pip';
    el.appendChild(cell);
  }
}

let timerInterval = null;
let secondsLeft = 0;
let running = false;

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  running = false;
  document.getElementById('startPause').textContent = 'Start';
}

function updateTimerDisplay() {
  const m = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
  const s = String(secondsLeft % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

document.getElementById('startPause').addEventListener('click', () => {
  if (running) {
    stopTimer();
    return;
  }
  running = true;
  document.getElementById('startPause').textContent = 'Pause';
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) {
      stopTimer();
      document.getElementById('timerDisplay').textContent = "Time's up";
    }
  }, 1000);
});

document.getElementById('resetTimer').addEventListener('click', () => {
  stopTimer();
  secondsLeft = window.currentDurationSeconds || 0;
  updateTimerDisplay();
});

document.getElementById('rollBtn').addEventListener('click', () => {
  const open = tasks.map((t, i) => ({ ...t, i })).filter(t => !t.done);
  if (open.length === 0) return;

  stopTimer();

  const taskFace = 1 + Math.floor(Math.random() * 6);
  const durFace = 1 + Math.floor(Math.random() * 6);

  document.getElementById('result').classList.add('show');
  const dieTask = document.getElementById('dieTask');
  const dieDur = document.getElementById('dieDur');

  let rolls = 0;
  const rollAnim = setInterval(() => {
    renderDie(dieTask, 1 + Math.floor(Math.random() * 6));
    renderDie(dieDur, 1 + Math.floor(Math.random() * 6));
    rolls++;
    if (rolls > 8) {
      clearInterval(rollAnim);
      renderDie(dieTask, taskFace);
      renderDie(dieDur, durFace);
      showResult(taskFace, durFace);
    }
  }, 70);
});

function showResult(taskFace, durFace) {
  document.querySelectorAll('.task-row').forEach(r => r.classList.remove('picked'));
  const chosen = tasks[taskFace - 1];
  const resultTaskEl = document.getElementById('resultTask');
  const resultDurEl = document.getElementById('resultDur');
  const timerWrap = document.getElementById('timerWrap');

  if (!chosen || chosen.done) {
    resultTaskEl.textContent = `Slot ${taskFace} is empty or done, roll again`;
    resultDurEl.textContent = '';
    timerWrap.classList.remove('show');
    return;
  }

  const rows = document.querySelectorAll('.task-row');
  if (rows[taskFace - 1]) rows[taskFace - 1].classList.add('picked');

  resultTaskEl.textContent = chosen.text;

  const mins = durations[durFace];
  if (mins === 0) {
    resultDurEl.textContent = 'Take a 10 min break';
    timerWrap.classList.add('show');
    window.currentDurationSeconds = 10 * 60;
  } else {
    resultDurEl.textContent = `Spend ${mins} min on it`;
    timerWrap.classList.add('show');
    window.currentDurationSeconds = mins * 60;
  }
  secondsLeft = window.currentDurationSeconds;
  updateTimerDisplay();
}

const JSONBLOB_BASE = 'https://jsonblob.com/api/jsonBlob';
let syncId = localStorage.getItem('rollATaskSyncId') || null;
let syncing = false;

function setSyncStatus(text, on) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.classList.toggle('on', !!on);
}

function refreshSyncUI() {
  const codeBox = document.getElementById('syncCodeBox');
  const codeText = document.getElementById('syncCodeText');
  const actions = document.getElementById('syncActions');
  if (syncId) {
    codeBox.style.display = 'flex';
    codeText.textContent = syncId;
    actions.innerHTML = '<button class="sync-btn" id="stopSyncBtn">Stop syncing</button>';
    document.getElementById('stopSyncBtn').addEventListener('click', stopSync);
    setSyncStatus('Synced — this device updates the cloud copy', true);
  } else {
    codeBox.style.display = 'none';
    actions.innerHTML = '<button class="sync-btn primary" id="startSyncBtn">Start syncing this device</button>';
    document.getElementById('startSyncBtn').addEventListener('click', startSync);
    setSyncStatus('Not synced — tasks only live on this device', false);
  }
}

async function startSync() {
  setSyncStatus('Setting up sync…');
  try {
    const res = await fetch(JSONBLOB_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ tasks })
    });
    if (!res.ok) throw new Error('create failed');
    const location = res.headers.get('Location');
    const id = location.split('/').pop();
    syncId = id;
    localStorage.setItem('rollATaskSyncId', syncId);
    refreshSyncUI();
  } catch (e) {
    setSyncStatus('Could not start sync — check your connection and try again');
  }
}

function stopSync() {
  syncId = null;
  localStorage.removeItem('rollATaskSyncId');
  refreshSyncUI();
}

async function connectToCode() {
  const input = document.getElementById('connectCodeInput');
  const code = input.value.trim();
  if (!code) return;
  setSyncStatus('Connecting…');
  try {
    const res = await fetch(`${JSONBLOB_BASE}/${code}`, {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    tasks = Array.isArray(data.tasks) ? data.tasks : [];
    syncId = code;
    localStorage.setItem('rollATaskSyncId', syncId);
    saveTasks();
    input.value = '';
    refreshSyncUI();
    render();
  } catch (e) {
    setSyncStatus("Couldn't find that code — double check it and try again");
  }
}

async function pushToCloud() {
  if (!syncId || syncing) return;
  syncing = true;
  try {
    await fetch(`${JSONBLOB_BASE}/${syncId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ tasks })
    });
  } catch (e) {
    // silently keep local copy; will retry on next change
  }
  syncing = false;
}

async function pullFromCloud() {
  if (!syncId) return;
  try {
    const res = await fetch(`${JSONBLOB_BASE}/${syncId}`, {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) return;
    const data = await res.json();
    tasks = Array.isArray(data.tasks) ? data.tasks : [];
    saveTasks();
    render();
  } catch (e) {
    // offline: fall back to whatever is cached locally
  }
}

document.getElementById('connectBtn').addEventListener('click', connectToCode);
document.getElementById('connectCodeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connectToCode();
});
document.getElementById('copyCode').addEventListener('click', () => {
  navigator.clipboard.writeText(syncId).then(() => {
    const btn = document.getElementById('copyCode');
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
});

loadTasks();
refreshSyncUI();
render();
if (syncId) pullFromCloud();
</script>
